name: OE3 Regression Tests
on:
  push:
    branches:
      - revision-oe3-correcciones-20261022
  pull_request:
    branches:
      - main
  workflow_dispatch:
jobs:
  oe3:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      DATABASE_URL: sqlite+pysqlite:///:memory:
      SESSION_SECRET: local-ci-test-secret
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run OE3 regression tests
        run: python -m pytest -q tests/test_oe3_regresion.py
